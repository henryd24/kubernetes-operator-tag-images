name: CI

on:
  push:
    branches: [trunk]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: Unit tests
        run: go test -race ./...
      - name: Integration tests (envtest)
        run: make test-integration
      - name: Build
        run: make build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Lint chart
        run: |
          helm lint charts/rollout-ecr-tagger --strict
          helm lint charts/rollout-ecr-tagger --strict \
            --set enableDeployments=true --set 'watchNamespaces={prod,staging}'

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: VERSION=${{ github.sha }}

name: Publish

# Se ejecuta al llegar a trunk un cambio de la versión del chart (el PR que abre
# el workflow "Release"). Publica la imagen multi-arch en GHCR y crea el GitHub
# Release con el chart empaquetado. Si el release de esa versión ya existe, no hace nada.

on:
  push:
    branches: [trunk]
    paths: [charts/rollout-ecr-tagger/Chart.yaml]

env:
  IMAGE: ghcr.io/henryd24/rollout-ecr-tagger

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(sed -n 's/^version: //p' charts/rollout-ecr-tagger/Chart.yaml)"
          app="$(sed -n 's/^appVersion: "\(.*\)"/\1/p' charts/rollout-ecr-tagger/Chart.yaml)"
          [ "$app" = "$tag" ] || { echo "::error::appVersion ($app) no coincide con version ($tag)"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "El release $tag ya existe: nada que publicar."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # "latest" solo se mueve en versiones estables (sin -rc, -beta, ...).
          tags: |
            type=raw,value=${{ needs.check.outputs.tag }}
            type=raw,value=latest,enable=${{ !contains(needs.check.outputs.tag, '-') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.check.outputs.tag }}

      - uses: azure/setup-helm@v5

      - name: Package Helm chart
        run: helm package charts/rollout-ecr-tagger

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          prerelease=""
          if [[ "$TAG" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$TAG" rollout-ecr-tagger-*.tgz \
            --title "$TAG" --generate-notes --target "$GITHUB_SHA" ${prerelease}

name: Release

# Publishes a multi-arch image and a GitHub release with the Helm chart when a
# version tag (e.g. v0.5.0) is pushed.
#
# Required repository secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  IMAGE: henda24/rollout-ecr-tagger

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # "latest" is only moved for stable versions (no -rc, -beta, ...).
          tags: |
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}

      - uses: azure/setup-helm@v4

      - name: Package Helm chart
        run: |
          helm package charts/rollout-ecr-tagger \
            --version "${GITHUB_REF_NAME#v}" \
            --app-version "${GITHUB_REF_NAME}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" rollout-ecr-tagger-*.tgz \
            --title "${GITHUB_REF_NAME}" --generate-notes ${prerelease}

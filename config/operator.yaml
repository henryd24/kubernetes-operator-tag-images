apiVersion: v1
kind: Namespace
metadata:
  name: rollout-ecr-tagger-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rollout-ecr-tagger-controller
  namespace: rollout-ecr-tagger-system
  # With IRSA, uncomment and set the IAM role that grants ecr:BatchGetImage and ecr:PutImage:
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/<ROLE_NAME>
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rollout-ecr-tagger-role
rules:
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch", "update"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["argoproj.io"]
  resources: ["rollouts"]
  verbs: ["get", "list", "watch", "patch", "update"]
# Read the workload referenced by a Rollout's spec.workloadRef.
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["podtemplates"]
  verbs: ["get"]
# Only needed with --enable-deployments: uncomment to tag Deployments labeled
# ecr-tagger.io/enabled=true.
# - apiGroups: ["apps"]
#   resources: ["deployments"]
#   verbs: ["list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rollout-ecr-tagger-rolebinding
subjects:
- kind: ServiceAccount
  name: rollout-ecr-tagger-controller
  namespace: rollout-ecr-tagger-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rollout-ecr-tagger-role
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rollout-ecr-tagger-config
  namespace: rollout-ecr-tagger-system
data:
  AWS_REGION: "us-east-1"
  # Optional: IAM role to assume for cross-account ECR tagging, e.g.
  # arn:aws:iam::<ECR_ACCOUNT_ID>:role/<ROLE_NAME>. Leave empty to use the pod credentials.
  TARGET_ROLE_ARN: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollout-ecr-tagger-controller
  namespace: rollout-ecr-tagger-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rollout-ecr-tagger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rollout-ecr-tagger
    spec:
      serviceAccountName: rollout-ecr-tagger-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: henda24/rollout-ecr-tagger:v0.4.0
        imagePullPolicy: IfNotPresent
        args:
        - --leader-elect=true
        # - --enable-deployments=true              # also tag labeled Deployments (see RBAC above)
        # - --watch-namespaces=prod,staging        # restrict to these namespaces
        envFrom:
        - configMapRef:
            name: rollout-ecr-tagger-config
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          privileged: false
          capabilities:
            drop: ["ALL"]
